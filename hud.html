<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether Pulse — Universal Liquid HUD</title>
  <style>
    :root {
      --bg-glass: rgba(13, 17, 23, 0.94);
      --bg-elevated: rgba(255, 255, 255, 0.04);
      --bg-featured: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --border-hairline: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #2997FF;
      --verified-text: #30D158;
      --flagged-text: #FF9F0A;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud-container {
      position: absolute;
      inset: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #aether-liquid-hud {
      position: relative;
      width: 408px;
      border-radius: 18px;
      background: var(--bg-glass);
      backdrop-filter: saturate(190%) blur(24px);
      -webkit-backdrop-filter: saturate(190%) blur(24px);
      border: 1px solid var(--border-strong);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      cursor: grab;
      -webkit-app-region: drag;
      transition: height 220ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms ease;
    }

    #aether-liquid-hud:active {
      cursor: grabbing;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    .hud-liquid-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    .hud-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 52px;
      min-height: 106px;
    }

    .hud-main {
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .hud-title-cluster {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .hud-window-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-inline-end: 2px;
      -webkit-app-region: no-drag;
    }

    .window-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .window-dot:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .window-dot.close { background: #FF5F56; border: 1px solid #E0443E; }
    .window-dot.min { background: #FFBD2E; border: 1px solid #DEA123; }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px currentColor;
      transition: background-color 240ms ease, box-shadow 240ms ease;
    }

    .hud-mode-pill {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .hud-metrics {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .hud-primary-val {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .hud-secondary-val {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .hud-foot {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .hud-drawer {
      display: none;
      margin-block-start: 8px;
      padding-block-start: 8px;
      border-block-start: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 11.5px;
      flex-direction: column;
      gap: 5px;
    }

    #aether-liquid-hud.expanded .hud-drawer {
      display: flex;
    }

    .hud-drawer-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .hud-drawer-row .harness-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hud-drawer-row .hdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .hud-side-col {
      display: flex;
      flex-direction: column;
      border-inline-start: 1px solid var(--border-hairline);
      -webkit-app-region: no-drag;
    }

    .hud-side-btn {
      appearance: none;
      border: none;
      flex: 1;
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      transition: background-color 140ms ease, transform 80ms ease;
    }

    .hud-side-btn:active {
      transform: scale(0.96);
    }

    .hud-side-btn + .hud-side-btn {
      border-block-start: 1px solid var(--border-hairline);
    }

    .hud-side-btn:hover {
      background: var(--bg-featured);
    }

    .hud-side-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .icon-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hud-mode-code {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="hud-container">
  <aside id="aether-liquid-hud" role="region" aria-label="Aether Pulse Liquid Telemetry HUD">
    <canvas class="hud-liquid-canvas" id="hud-liquid-canvas" width="408" height="196"></canvas>
    <div class="hud-inner">
      <div class="hud-main">
        <div class="hud-top">
          <span class="hud-title-cluster">
            <span class="hud-window-dots">
              <span class="window-dot close" onclick="closeHudWindow(event)" title="Close HUD"></span>
              <span class="window-dot min" onclick="minimizeHudWindow(event)" title="Minimize HUD"></span>
            </span>
            <span class="hud-dot" id="hud-dot"></span>
            <span id="hud-harness-name">3-Harness Trinity Mesh</span>
          </span>
          <span class="hud-mode-pill" id="hud-mode-pill">Pinned · Pin</span>
        </div>
        <div class="hud-metrics">
          <span class="hud-primary-val" id="hud-cache-val">94.4% Cache</span>
          <span class="hud-secondary-val" id="hud-vol-val">4.20B · $303.68 · 26,776 pts</span>
        </div>
        <div class="hud-foot">
          <span id="hud-target-label">Over: 3-Harness Mesh</span>
          <span id="hud-saved-val">Saved $10,553</span>
        </div>
        <div class="hud-drawer" id="hud-all-drawer">
          <div class="hud-drawer-row" id="row-claude">
            <span class="harness-tag"><span class="hdot" style="background:#E07A5F"></span>Claude Code</span>
            <span id="drawer-claude">2.01B · $271.02 · 94.94%</span>
          </div>
          <div class="hud-drawer-row" id="row-gemini" style="display:none;">
            <span class="harness-tag"><span class="hdot" style="background:#1A73E8"></span>Google Gemini</span>
            <span id="drawer-gemini">1.45B · $48.20 · 95.12%</span>
          </div>
          <div class="hud-drawer-row" id="row-agy">
            <span class="harness-tag"><span class="hdot" style="background:#2997FF"></span>Antigravity</span>
            <span id="drawer-agy">2.03B · $2.57 · 93.67%</span>
          </div>
          <div class="hud-drawer-row" id="row-codex">
            <span class="harness-tag"><span class="hdot" style="background:#30D158"></span>OpenAI Codex</span>
            <span id="drawer-codex">154.3M · $30.10 · 96.77%</span>
          </div>
        </div>
      </div>
      <div class="hud-side-col">
        <button type="button" class="hud-side-btn" id="hud-side-CycleBtn" onclick="cycleHudOverlayMode(event)" title="1-Click Mode Switcher: ALL 3 / ALL 4 / CLAU / GEMI / AGY / CODX / AUTO">
          <svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 5c2-1.5 4 1.5 6 0s4-1.5 6 0M2 8.5c2-1.5 4 1.5 6 0s4-1.5 6 0M2 12c2-1.5 4 1.5 6 0s4-1.5 6 0"/>
          </svg>
          <span class="hud-mode-code" id="hud-mode-code">ALL 3</span>
        </button>
        <button type="button" class="hud-side-btn" id="hud-side-BoundaryBtn" onclick="cycleHudBoundaryMode(event)" title="Physics Mode: Pinned (PIN) / Bounce off Walls (BNC) / Pac-Man Wrap (PAC)">
          <span class="hud-mode-code" id="hud-bmode-code" style="color:var(--verified-text);">PIN</span>
        </button>
        <button type="button" class="hud-side-btn" id="hud-side-TopmostBtn" onclick="toggleOverlayTopmost(event)" title="Always On Top Toggle (📌TOP)">
          <span class="hud-mode-code" id="hud-topmost-code" style="color:var(--verified-text);">📌TOP</span>
        </button>
      </div>
    </div>
  </aside>
</div>

<script>
const HUD_HARNESSES = {
  all: {
    name: "3-Harness Trinity Mesh",
    short: "ALL 3",
    cache: "94.4% Cache",
    vol: "4.20B · $303.68 · 26,776 pts",
    saved: "Saved $10,553",
    target: "Over: 3-Harness Mesh",
    fill: 0.944,
    color: "#2997FF",
    showGemini: false
  },
  all4: {
    name: "4-Harness Quap Mesh",
    short: "ALL 4",
    cache: "94.4% Cache",
    vol: "4.43B · $303.68 · 27,056 pts",
    saved: "Saved $11,140",
    target: "Over: 4-Harness Mesh",
    fill: 0.944,
    color: "#0066CC",
    showGemini: true
  },
  claude_code: {
    name: "Anthropic Claude Code",
    short: "CLAU",
    cache: "94.94% Cache",
    vol: "2.01B · $271.02 · 21,126 pts",
    saved: "Saved $5,042",
    target: "Claude Code CLI",
    fill: 0.9494,
    color: "#E07A5F",
    showGemini: false
  },
  gemini: {
    name: "Google Gemini",
    short: "GEMI",
    cache: "95.12% Cache",
    vol: "1.45B · $48.20 · 22,410 pts",
    saved: "Saved $3,920",
    target: "Google Gemini 2.5 / 3.0 Pro",
    fill: 0.9512,
    color: "#1A73E8",
    showGemini: true
  },
  antigravity: {
    name: "Google Antigravity",
    short: "AGY",
    cache: "93.67% Cache",
    vol: "2.03B · $2.57 · 21,310 pts",
    saved: "Saved $5,653",
    target: "Google Antigravity Architecture",
    fill: 0.9367,
    color: "#2997FF",
    showGemini: false
  },
  openai_codex: {
    name: "OpenAI Codex CLI",
    short: "CODX",
    cache: "96.77% Cache",
    vol: "154.3M · $30.10 · 15,818 pts",
    saved: "Saved $445",
    target: "OpenAI Codex Terminal",
    fill: 0.9677,
    color: "#30D158",
    showGemini: false
  }
};

const HUD_MODES = ["all", "all4", "auto", "claude_code", "gemini", "antigravity", "openai_codex"];
const HUD_SHORT = { all: "ALL 3", all4: "ALL 4", auto: "AUTO", claude_code: "CLAU", gemini: "GEMI", antigravity: "AGY", openai_codex: "CODX" };
const HUD_BMODES = ["pin", "bounce", "pacman"];
const HUD_BSHORT = { pin: "PIN", bounce: "BNC", pacman: "PAC" };

let hudMode = "all";
let hudBoundaryMode = "pin";
let hudDetected = "all";
let hudSocket = null;
let isTopmost = true;

const hudEl = document.getElementById("aether-liquid-hud");
const hudCanvas = document.getElementById("hud-liquid-canvas");
const hudCtx = hudCanvas ? hudCanvas.getContext("2d") : null;

// Ensure high-DPI crispness on 4K / Retina displays
function resizeCanvasDpr() {
  if (!hudCanvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = hudEl.getBoundingClientRect();
  const targetW = Math.round(rect.width || 408);
  const isMesh = (hudMode === "all" || hudMode === "all4");
  const targetH = isMesh ? (hudMode === "all4" ? 208 : 188) : 106;
  if (hudCanvas.width !== targetW * dpr || hudCanvas.height !== targetH * dpr) {
    hudCanvas.width = targetW * dpr;
    hudCanvas.height = targetH * dpr;
    if (hudCtx) hudCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

const hudPhys = {
  phase: 0.0,
  tiltDeg: 0.0,
  fillRatio: 0.944,
  color: "#2997FF",
  waves: new Array(24).fill(0),
  waveVels: new Array(24).fill(0)
};

function renderHudText() {
  const key = hudMode === "auto" ? hudDetected : hudMode;
  const info = HUD_HARNESSES[key] || HUD_HARNESSES.all;
  hudPhys.fillRatio = info.fill;
  hudPhys.color = info.color;

  const bName = hudBoundaryMode === "pin" ? "Pin" : hudBoundaryMode === "bounce" ? "Bounce" : "Pac-Man";
  document.getElementById("hud-dot").style.backgroundColor = info.color;
  document.getElementById("hud-dot").style.boxShadow = `0 0 8px ${info.color}`;
  document.getElementById("hud-harness-name").textContent = info.name;
  document.getElementById("hud-mode-pill").textContent = (hudMode === "auto" ? "Auto" : "Pinned") + " · " + bName;
  document.getElementById("hud-cache-val").textContent = info.cache;
  document.getElementById("hud-vol-val").textContent = info.vol;
  document.getElementById("hud-target-label").textContent = info.target || "Over: 3-Harness Mesh";
  document.getElementById("hud-saved-val").textContent = info.saved;
  document.getElementById("hud-mode-code").textContent = HUD_SHORT[hudMode] || "ALL 3";

  const bEl = document.getElementById("hud-bmode-code");
  if (bEl) {
    bEl.textContent = HUD_BSHORT[hudBoundaryMode] || "PIN";
    bEl.style.color = hudBoundaryMode === "pin" ? "var(--verified-text)" : hudBoundaryMode === "bounce" ? "var(--text-primary)" : "var(--flagged-text)";
  }

  const isMesh = (hudMode === "all" || hudMode === "all4");
  hudEl.classList.toggle("expanded", isMesh);

  const geminiRow = document.getElementById("row-gemini");
  if (geminiRow) {
    geminiRow.style.display = info.showGemini ? "flex" : "none";
  }

  resizeCanvasDpr();
}

function cycleHudOverlayMode(ev) {
  if (ev) ev.stopPropagation();
  const idx = (HUD_MODES.indexOf(hudMode) + 1) % HUD_MODES.length;
  hudMode = HUD_MODES[idx];
  hudPhys.waveVels[12] += 42.0;
  renderHudText();
  if (hudSocket && hudSocket.readyState === 1) {
    hudSocket.send(JSON.stringify({ type: "set_mode", mode: hudMode }));
  }
}

function cycleHudBoundaryMode(ev) {
  if (ev) ev.stopPropagation();
  const idx = (HUD_BMODES.indexOf(hudBoundaryMode) + 1) % HUD_BMODES.length;
  hudBoundaryMode = HUD_BMODES[idx];
  hudPhys.waveVels[12] += 36.0;
  renderHudText();
  if (hudSocket && hudSocket.readyState === 1) {
    hudSocket.send(JSON.stringify({ type: "set_boundary", boundary_mode: hudBoundaryMode }));
  }
}

function toggleOverlayTopmost(ev) {
  if (ev) ev.stopPropagation();
  isTopmost = !isTopmost;
  const topEl = document.getElementById("hud-topmost-code");
  if (topEl) {
    topEl.style.color = isTopmost ? "var(--verified-text)" : "var(--text-muted)";
  }
  if (window.pywebview && window.pywebview.api && window.pywebview.api.set_on_top) {
    window.pywebview.api.set_on_top(isTopmost);
  }
  fetch("/api/toggle_topmost").catch(() => {});
}

function closeHudWindow(ev) {
  if (ev) ev.stopPropagation();
  if (window.pywebview && window.pywebview.api && window.pywebview.api.close) {
    window.pywebview.api.close();
  } else {
    window.close();
  }
}

function minimizeHudWindow(ev) {
  if (ev) ev.stopPropagation();
  if (window.pywebview && window.pywebview.api && window.pywebview.api.minimize) {
    window.pywebview.api.minimize();
  }
}

function connectWebSocket() {
  try {
    const wsUrl = `ws://${window.location.hostname || "127.0.0.1"}:8765/ws`;
    hudSocket = new WebSocket(wsUrl);

    hudSocket.addEventListener("message", (ev) => {
      try {
        const frame = JSON.parse(ev.data);
        if (frame.detected_harness && hudMode === "auto") {
          hudDetected = frame.detected_harness;
        }
        if (frame.harnesses) {
          if (frame.harnesses.claude_code && document.getElementById("drawer-claude")) {
            const c = frame.harnesses.claude_code;
            document.getElementById("drawer-claude").textContent = `${c.tokens_formatted} · $${c.cost_usd} · ${c.cache_hit_pct}%`;
          }
          if (frame.harnesses.gemini && document.getElementById("drawer-gemini")) {
            const g = frame.harnesses.gemini;
            document.getElementById("drawer-gemini").textContent = `${g.tokens_formatted} · $${g.cost_usd} · ${g.cache_hit_pct}%`;
          }
          if (frame.harnesses.antigravity && document.getElementById("drawer-agy")) {
            const a = frame.harnesses.antigravity;
            document.getElementById("drawer-agy").textContent = `${a.tokens_formatted} · $${a.cost_usd} · ${a.cache_hit_pct}%`;
          }
          if (frame.harnesses.openai_codex && document.getElementById("drawer-codex")) {
            const o = frame.harnesses.openai_codex;
            document.getElementById("drawer-codex").textContent = `${o.tokens_formatted} · $${o.cost_usd} · ${o.cache_hit_pct}%`;
          }
        }
        renderHudText();
      } catch (_e) {}
    });

    hudSocket.addEventListener("close", () => {
      setTimeout(connectWebSocket, 2500);
    });
  } catch (_err) {
    setTimeout(connectWebSocket, 3000);
  }
}

// Liquid wave render loop with smooth shallow water simulation
let lastT = performance.now();
function stepCanvas(now) {
  const dt = Math.max(0.001, Math.min(0.04, (now - lastT) / 1000));
  lastT = now;
  hudPhys.phase += dt;

  const n = hudPhys.waves.length;
  for (let i = 0; i < n; i++) {
    const ripple = Math.sin(now * 0.0028 + i * 0.48) * 0.28;
    const spring = -96.0 * hudPhys.waves[i] - 5.2 * hudPhys.waveVels[i];
    hudPhys.waveVels[i] += spring * dt + ripple;
    hudPhys.waves[i] += hudPhys.waveVels[i] * dt;
    hudPhys.waves[i] = Math.max(-14, Math.min(14, hudPhys.waves[i]));
  }

  // Neighbor wave coupling
  for (let iter = 0; iter < 4; iter++) {
    for (let i = 0; i < n; i++) {
      if (i > 0) {
        const leftDiff = 0.024 * (hudPhys.waves[i] - hudPhys.waves[i - 1]);
        hudPhys.waveVels[i - 1] += leftDiff;
        hudPhys.waves[i - 1] += leftDiff;
      }
      if (i < n - 1) {
        const rightDiff = 0.024 * (hudPhys.waves[i] - hudPhys.waves[i + 1]);
        hudPhys.waveVels[i + 1] += rightDiff;
        hudPhys.waves[i + 1] += rightDiff;
      }
    }
  }

  if (hudCtx && hudCanvas) {
    const w = 408;
    const isMesh = (hudMode === "all" || hudMode === "all4");
    const h = isMesh ? (hudMode === "all4" ? 208 : 188) : 106;
    hudCtx.clearRect(0, 0, w, h);

    const fillLevel = Math.max(0.2, Math.min(0.92, hudPhys.fillRatio));
    // Position meniscus line right at the drawer boundary for the glowing blue accent line
    const baseY = isMesh ? 88 : (h - h * 0.38 * fillLevel);

    // Draw Liquid Body
    hudCtx.beginPath();
    hudCtx.moveTo(0, h);
    for (let i = 0; i < n; i++) {
      const px = (i / (n - 1)) * w;
      const py = baseY + hudPhys.waves[i];
      if (i === 0) {
        hudCtx.lineTo(px, py);
      } else {
        const prevPx = ((i - 1) / (n - 1)) * w;
        const prevPy = baseY + hudPhys.waves[i - 1];
        const cx = (prevPx + px) / 2;
        const cy = (prevPy + py) / 2;
        hudCtx.quadraticCurveTo(prevPx, prevPy, cx, cy);
      }
    }
    hudCtx.lineTo(w, h);
    hudCtx.closePath();

    // Subtle translucent liquid gradient
    const grad = hudCtx.createLinearGradient(0, baseY - 10, 0, h);
    grad.addColorStop(0, "rgba(41, 151, 255, 0.14)");
    grad.addColorStop(1, "rgba(41, 151, 255, 0.03)");
    hudCtx.fillStyle = grad;
    hudCtx.fill();

    // Draw Glowing Liquid Meniscus Surface Line (Image 1 & 2 separator)
    hudCtx.beginPath();
    for (let i = 0; i < n; i++) {
      const px = (i / (n - 1)) * w;
      const py = baseY + hudPhys.waves[i];
      if (i === 0) {
        hudCtx.moveTo(px, py);
      } else {
        const prevPx = ((i - 1) / (n - 1)) * w;
        const prevPy = baseY + hudPhys.waves[i - 1];
        const cx = (prevPx + px) / 2;
        const cy = (prevPy + py) / 2;
        hudCtx.quadraticCurveTo(prevPx, prevPy, cx, cy);
      }
    }
    hudCtx.strokeStyle = hudPhys.color;
    hudCtx.lineWidth = 1.75;
    hudCtx.stroke();
  }

  requestAnimationFrame(stepCanvas);
}

// Keyboard shortcuts
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    cycleHudOverlayMode();
  } else if (e.key === "p" || e.key === "P") {
    cycleHudBoundaryMode();
  } else if (e.key === "t" || e.key === "T") {
    toggleOverlayTopmost();
  } else if (e.key === "Escape" || e.key === "q") {
    closeHudWindow();
  }
});

// Initialize HUD on load
renderHudText();
connectWebSocket();
requestAnimationFrame(stepCanvas);
</script>
</body>
</html>
